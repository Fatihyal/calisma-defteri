<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Çalışma Defterim</title>
<style>
  :root { --bg:#f3f6f4; --card:#fff; --ink:#26303b; --soft:#657282; --main:#2f6f6a; --main-d:#245a56; --main-l:#e6f0ee; --warn:#c2502f; --ok:#2e7d4f; --line:#dfe6e3; --mark:#ffe08a; --shadow:0 2px 10px rgba(38,48,59,.07); }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:22px/1.5 "Segoe UI",system-ui,sans-serif; }
  header { background:linear-gradient(135deg,#2a625d,#3f8d85); color:#fff; padding:16px 22px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; box-shadow:0 2px 12px rgba(0,0,0,.15); }
  header .brand h1 { font-size:26px; margin:0; font-weight:700; letter-spacing:.2px; }
  header .brand span { font-size:16px; opacity:.88; }
  header .nav { display:flex; gap:10px; }
  header button { background:#ffffff26; color:#fff; border:1px solid #ffffff66; min-height:44px; padding:8px 18px; font-size:18px; }
  main { max-width:820px; margin:0 auto; padding:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:24px; margin-bottom:18px; box-shadow:var(--shadow); }
  h2 { font-size:25px; margin:0 0 10px; }
  h3 { font-size:21px; margin:18px 0 6px; color:var(--main-d); }
  p { margin:8px 0; }
  p.hint { color:var(--soft); font-size:18px; margin:4px 0 12px; }
  .tip { background:var(--main-l); border-left:6px solid var(--main); border-radius:12px; padding:12px 16px; font-size:19px; margin:12px 0; }
  button { font:inherit; font-weight:600; padding:14px 26px; border-radius:14px; border:0; background:var(--main); color:#fff; cursor:pointer; min-height:56px; box-shadow:0 2px 0 var(--main-d); }
  button:active { transform:translateY(1px); box-shadow:none; }
  button.alt { background:var(--main-l); color:var(--main-d); box-shadow:none; }
  button.danger { background:#f7e3dc; color:var(--warn); min-height:48px; padding:8px 16px; box-shadow:none; }
  button.mic { background:#b8432f; width:100%; font-size:22px; margin-top:6px; box-shadow:0 2px 0 #8c3222; }
  button.mic.live { background:#2e7d4f; box-shadow:0 2px 0 #1f5a37; }
  button:disabled { opacity:.45; }
  .row { display:flex; gap:12px; flex-wrap:wrap; margin-top:16px; }
  input[type=text], input[type=date], textarea { font:inherit; width:100%; padding:14px; border:2px solid var(--line); border-radius:12px; background:#fff; color:var(--ink); }
  input:focus, textarea:focus { outline:none; border-color:var(--main); }
  textarea { min-height:190px; resize:vertical; }
  label { display:block; font-weight:700; margin:18px 0 6px; }
  .chips { display:flex; flex-wrap:wrap; gap:10px; }
  .chip { padding:10px 20px; border-radius:999px; background:var(--main-l); color:var(--main-d); font-weight:600; cursor:pointer; user-select:none; border:2px solid transparent; }
  .chip.on { background:var(--main); color:#fff; }
  .bank .chip { font-size:22px; padding:12px 22px; background:#fff; border-color:var(--main); }
  .bank .chip.used { opacity:.25; pointer-events:none; }
  .word { display:inline-block; padding:4px 7px; margin:3px 1px; border-radius:8px; cursor:pointer; }
  .word.on { background:var(--mark); font-weight:700; }
  .item { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 0; border-bottom:1px solid var(--line); color:var(--ink); }
  .item:last-child { border-bottom:0; }
  .item small { color:var(--soft); display:block; font-size:17px; }
  .blank { display:inline-block; min-width:110px; padding:2px 12px; margin:2px; border-bottom:4px solid var(--main); background:var(--main-l); border-radius:8px; text-align:center; cursor:pointer; min-height:44px; }
  .good { color:var(--ok); font-weight:700; background:#e3f3e8; border-radius:6px; padding:0 5px; }
  .bad { color:var(--warn); font-weight:700; background:#fbe6df; border-radius:6px; padding:0 5px; }
  .big { font-size:28px; font-weight:700; line-height:1.35; }
  .tag { display:inline-block; background:var(--main-l); color:var(--main-d); border-radius:999px; padding:4px 14px; font-size:18px; font-weight:600; }
  .empty { color:var(--soft); text-align:center; padding:18px 0; }
  details { margin-top:14px; color:var(--soft); }
  details > summary { cursor:pointer; padding:8px 0; font-weight:600; }
  details[open] > summary { color:var(--main-d); }
  .stepper { display:flex; gap:8px; margin:0 0 18px; }
  .st { flex:1; text-align:center; font-size:15px; color:var(--soft); font-weight:600; }
  .st .dot { width:34px; height:34px; line-height:34px; border-radius:50%; background:var(--line); color:var(--soft); display:block; margin:0 auto 4px; font-size:17px; }
  .st.on .dot { background:var(--main); color:#fff; }
  .st.on { color:var(--main-d); }
  .st.done .dot { background:var(--ok); color:#fff; }
  .stats { display:flex; gap:12px; margin-bottom:18px; }
  .stat { flex:1; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px 16px; box-shadow:var(--shadow); }
  .stat b { display:block; font-size:30px; color:var(--main-d); line-height:1.1; }
  .stat span { font-size:16px; color:var(--soft); }
  ol.how { padding-left:0; list-style:none; counter-reset:s; margin:8px 0; }
  ol.how li { counter-increment:s; position:relative; padding:6px 0 6px 52px; min-height:44px; }
  ol.how li::before { content:counter(s); position:absolute; left:0; top:6px; width:38px; height:38px; line-height:38px; border-radius:50%; background:var(--main); color:#fff; text-align:center; font-weight:700; }
  ol.how li b { color:var(--main-d); }
</style>
</head>
<body>
<header>
  <div class="brand"><h1>Çalışma Defterim</h1><span>Oku, kapat, anlat, unutmadan tekrar et</span></div>
  <div class="nav"><button id="helpBtn">Nasıl çalışır?</button><button id="homeBtn">Ana sayfa</button></div>
</header>
<main id="app"></main>

<script>
/* ---------- Veri ---------- */
const KEY = 'calisma-defteri-v1';
let notes = JSON.parse(localStorage.getItem(KEY) || '[]');
const save = () => localStorage.setItem(KEY, JSON.stringify(notes));

const today = () => { const d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset()*60000) / 864e5); };
const dayToDate = n => new Date(n*864e5 + new Date().getTimezoneOffset()*60000);
const fmt = n => dayToDate(n).toLocaleDateString('tr-TR', {day:'numeric', month:'long'});
const dateInputToDay = v => { if(!v) return null; const [y,m,d] = v.split('-').map(Number); return Math.floor(Date.UTC(y,m-1,d)/864e5); };
const tr = s => s.toLocaleLowerCase('tr');
const tokens = text => text.match(/[\p{L}\p{N}]+|[^\p{L}\p{N}]+/gu) || [];
const isWord = t => /[\p{L}\p{N}]/u.test(t);

/* Tekrar aralığı: sınav günü varsa ilk aralık kalan günün onda biri, sonra ikiye katlanır;
   yoksa 1-3-7-14-30-60 gün. */
const LADDER = [1,3,7,14,30,60];
function nextDue(n, result) {
  const t = today();
  if (result === 'bad') { n.step = 0; n.gap = 1; return t + 1; }
  if (result === 'part') return t + 2;
  n.step = (n.step || 0) + 1;
  if (n.sinav && n.sinav > t) {
    const gap = n.gap ? n.gap * 2 : Math.max(1, Math.ceil((n.sinav - t) / 10));
    n.gap = gap;
    return Math.min(t + gap, Math.max(t + 1, n.sinav - 1));
  }
  return t + LADDER[Math.min(n.step, LADDER.length - 1)];
}

/* ---------- Yardımcılar ---------- */
function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) e.append(kid instanceof Node ? kid : document.createTextNode(kid));
  return e;
}
const app = document.getElementById('app');
let stopMic = null;
const show = (...els) => { if (stopMic) stopMic(); app.replaceChildren(...els); window.scrollTo(0, 0); };
document.getElementById('homeBtn').onclick = () => home();
document.getElementById('helpBtn').onclick = () => help();

const tip = text => h('div', {class:'tip'}, text);
function stepper(labels, current) {
  return h('div', {class:'stepper'}, labels.map((l, i) =>
    h('div', {class:'st' + (i === current ? ' on' : i < current ? ' done' : '')}, h('span', {class:'dot'}, String(i + 1)), l)));
}

/* Sesle yazma: Chrome'un konuşma tanıma özelliği (internet gerekir) */
function micButton(target) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return h('p', {class:'hint'}, 'Bu tarayıcıda sesle yazma yok. Klavyedeki mikrofon simgesine dokunarak da konuşabilirsin.');
  let rec = null, on = false;
  const btn = h('button', {class:'mic', type:'button'}, 'Konuşarak yaz');
  const status = h('p', {class:'hint'});
  const ui = () => { btn.classList.toggle('live', on); btn.textContent = on ? 'Dinliyorum... bitince dokun' : 'Konuşarak yaz'; };
  const ERR = {
    'not-allowed': 'Mikrofon izni verilmedi. Adres çubuğundaki kilit simgesinden mikrofona izin ver.',
    'service-not-allowed': 'Bu sayfada mikrofon kullanımına izin yok. Adres https ile başlamalı.',
    'audio-capture': 'Mikrofon bulunamadı veya başka bir program kullanıyor.',
    'network': 'Konuşma tanıma servisine ulaşılamadı. İnternet bağlantısını ve tarayıcıyı (Chrome olmalı) kontrol et.',
    'language-not-supported': 'Türkçe konuşma tanıma bu tarayıcıda desteklenmiyor.',
    'no-speech': 'Ses duyulmadı.'
  };
  const begin = () => {
    rec = new SR(); rec.lang = 'tr-TR'; rec.interimResults = true;
    rec.continuous = !/Android/i.test(navigator.userAgent);  // Android'de sürekli mod cümleleri tekrarlıyor
    let base = target.value;  // bu oturumdan önceki yazı
    rec.onstart = () => { status.textContent = ''; };
    rec.onresult = e => {  // her seferinde oturumun tamamından yeniden kur; hiçbir cümle kaybolmaz
      let txt = '';
      for (let i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript + ' ';
      target.value = (base + ' ' + txt).trim();
    };
    rec.onerror = ev => {
      status.textContent = ERR[ev.error] || ('Hata: ' + ev.error);
      if (ev.error !== 'no-speech') { on = false; ui(); }
    };
    rec.onend = () => { base = target.value; if (on) { try { rec.start(); } catch { on = false; ui(); } } else ui(); };
    try { rec.start(); } catch (err) { on = false; ui(); status.textContent = 'Başlatılamadı: ' + err.message; }
  };
  const stop = () => { on = false; if (rec) { try { rec.stop(); } catch {} } ui(); };
  btn.onclick = () => {
    if (on) return stop();
    if (!window.isSecureContext) { status.textContent = 'Sesle yazma için sayfa güvenli adresten (https) açılmalı. Bilgisayardaki dosyadan değil, internet adresinden aç.'; return; }
    status.textContent = ''; on = true; ui(); begin(); stopMic = stop;
  };
  return h('div', {}, btn, h('p', {class:'hint', style:'margin:4px 0 0'}, 'Dokun ve konuş, bitirince yeniden dokun. İnternet gerekir, ilk seferde izin ister.'), status);
}

/* ---------- Nasıl çalışır ---------- */
const howSteps = () => h('ol', {class:'how'},
  h('li', {}, h('b', {}, 'Bir soru seç. '), 'Okumadan önce kendine soru sor. Cevabını arayarak okursan daha iyi aklında kalır.'),
  h('li', {}, h('b', {}, 'Oku, kitabı kapat, anlat. '), 'Konuyu oku, sonra kitabı kapat ve cevabı kendi cümlelerinle konuşarak ya da yazarak anlat.'),
  h('li', {}, h('b', {}, 'Önemli kelimeleri seç. '), 'Uygulama bazı kelimeleri önerir. Tekrar günü bu kelimeler boşluk olur.'),
  h('li', {}, h('b', {}, 'Tekrar günü gelince tekrar et. '), 'Uygulama sana ne zaman tekrar edeceğini söyler. Önce hiçbir yere bakmadan anlat, sonra boşlukları doldur.'));

function help() {
  show(h('div', {class:'card'},
    h('h2', {}, 'Nasıl çalışır?'), howSteps(),
    h('h3', {}, 'Neden işe yarıyor?'),
    h('p', {}, 'Aynı yeri defalarca okumak seni kandırır: sayfa tanıdık gelir, bildiğini sanırsın. Kitabı kapatıp hatırlamaya çalışmak ise öğrenmeyi gerçekten yapan şeydir. Bir araştırmada metni 14 kez okuyanlar bir hafta sonra yarısını unutmuş. Bir kez okuyup hatırlamaya çalışanlar sadece yedide birini unutmuş.'),
    h('p', {}, 'Tekrarlar da tam unutmaya başladığın sırada gelir. O zaman hatırlamak, bilgiyi kalıcı yapar. Zorlanıyorsan doğru yoldasın.'),
    h('h3', {}, 'Tekrar günleri nasıl belirlenir?'),
    h('p', {}, 'İlk tekrar ertesi gün, sonra 3 gün, 1 hafta, 2 hafta sonra gelir. İyi hatırlarsan aralık uzar, zorlanırsan kısalır. Sınav günü girersen tekrarlar sınava göre ayarlanır.'),
    h('h3', {}, 'Konuşarak yazma'),
    h('p', {}, 'Kırmızı "Konuşarak yaz" düğmesi sesini yazıya çevirir. İnternet ister ve ilk seferde mikrofon izni sorar, "İzin ver" demelisin.'),
    h('h3', {}, 'Notlarım nerede duruyor?'),
    h('p', {}, 'Notların sadece bu cihazın tarayıcısında saklanır, başka yere gönderilmez. Tarayıcı verisi silinirse ya da cihaz değişirse notlar kaybolur. Bunun için ana sayfanın altındaki "Yedekleme" bölümü var: "Yedek al" notlarını bir dosya olarak kaydeder, "Yedek yükle" o dosyayı geri getirir. Ayda bir yedek almak iyi olur.'),
    h('div', {class:'row'}, h('button', {onclick: home}, 'Anladım'))));
}

/* ---------- Ana sayfa ---------- */
function home() {
  const t = today();
  const due = notes.filter(n => n.due <= t).sort((a,b) => a.due - b.due);
  const rest = notes.filter(n => n.due > t).sort((a,b) => a.due - b.due);
  const parts = [];

  if (!notes.length) {
    parts.push(h('div', {class:'card'}, h('h2', {}, 'Hoş geldin'), howSteps(),
      h('p', {class:'hint'}, 'Daha fazla bilgi için üstteki "Nasıl çalışır?" düğmesine dokun.')));
  } else {
    parts.push(h('div', {class:'stats'},
      h('div', {class:'stat'}, h('b', {}, String(due.length)), h('span', {}, 'bugün tekrar')),
      h('div', {class:'stat'}, h('b', {}, String(notes.length)), h('span', {}, 'toplam not'))));
  }
  parts.push(h('div', {class:'row', style:'margin:0 0 18px'}, h('button', {class:'big', onclick: () => addNote()}, '+ Yeni not ekle')));

  if (notes.length) {
    const dueCard = h('div', {class:'card'}, h('h2', {}, 'Bugün tekrar'),
      h('p', {class:'hint'}, 'Bu notların tekrar günü geldi. Önce hiçbir yere bakmadan aklında kalanı anlat.'));
    if (!due.length) dueCard.append(h('div', {class:'empty'}, 'Bugünlük tekrar yok. Güzel!'));
    due.forEach(n => dueCard.append(h('div', {class:'item'},
      h('div', {}, h('strong', {}, n.soru), h('small', {}, n.ders)),
      h('button', {onclick: () => review(n.id)}, 'Tekrar et'))));
    parts.push(dueCard);
  }

  if (rest.length) {
    const restCard = h('div', {class:'card'}, h('h2', {}, 'Sonraki günler'),
      h('p', {class:'hint'}, 'Bu notların tekrar günü henüz gelmedi. Vakti gelince yukarıya çıkarlar.'));
    rest.forEach(n => restCard.append(h('div', {class:'item'},
      h('div', {}, h('strong', {}, n.soru), h('small', {}, `${n.ders} · tekrar: ${fmt(n.due)}`)),
      h('button', {class:'danger', onclick: () => { if (confirm('Bu not silinsin mi?')) { notes = notes.filter(x => x.id !== n.id); save(); home(); } }}, 'Sil'))));
    parts.push(restCard);
  }

  const fileIn = h('input', {type:'file', accept:'.json', style:'display:none', onchange: restore});
  parts.push(h('details', {}, h('summary', {}, 'Yedekleme (ebeveyn için)'),
    h('div', {class:'tip'}, 'Notların sadece bu cihazın tarayıcısında durur. Tarayıcı verisi silinirse ya da cihaz değişirse kaybolur. "Yedek al" notlarını bir dosya olarak indirir. "Yedek yükle" o dosyayı geri getirir. Ayda bir yedek almak iyi olur.'),
    h('div', {class:'row'}, h('button', {class:'alt', onclick: backup}, 'Yedek al'), h('button', {class:'alt', onclick: () => fileIn.click()}, 'Yedek yükle'))), fileIn);
  show(...parts);
}

function backup() {
  h('a', {href: URL.createObjectURL(new Blob([JSON.stringify(notes)], {type:'application/json'})), download:`calisma-defteri-yedek-${today()}.json`}).click();
}
function restore(e) {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(txt => {
    try {
      const data = JSON.parse(txt);
      if (!Array.isArray(data)) throw 0;
      if (confirm(`Yedekteki ${data.length} not yüklenecek. Şimdiki notların yerine geçer. Devam?`)) { notes = data; save(); home(); }
    } catch { alert('Bu dosya geçerli bir yedek değil.'); }
  });
}

/* ---------- Yeni not: 3 kısa adım ---------- */
const STOP = new Set(['çünkü','ancak','fakat','ayrıca','böylece','bunun','bunlar','onlar','kadar','olarak','yüzden','sonra','gibi','daha','ama','için','veya','ile','olan','olur','oluyor','yapar','bütün','birçok']);
function suggestKeys(text) {
  const toks = tokens(text), seen = new Set(), cands = [];
  toks.forEach((tk, i) => { const w = tr(tk); if (isWord(tk) && tk.length >= 6 && !STOP.has(w) && !seen.has(w) && !/^\d+$/.test(tk)) { seen.add(w); cands.push({i, len:tk.length}); } });
  return cands.sort((a, b) => b.len - a.len).slice(0, 6).map(c => c.i);
}

/* Hazır sorular: 5. sınıf, 2026-2027 1. dönem. Kaynak: MEB Türkiye Yüzyılı Maarif Modeli
   öğretim programları ve 5. sınıf 1. kitapları (tymm.meb.gov.tr). Sayfa numaraları kitabın basılı numarasıdır, baskıya göre 1-2 sayfa kayabilir. Cevap verilmez;
   çocuk konuyu ders kitabından okur ve kendi cümlelerinle anlatır. */
const CURRICULUM = {
  'Fen Bilimleri': [
    {unite:'1. Ünite: Gökyüzündeki Komşularımız ve Biz', q:[
      ['Güneş nasıl bir yapıdadır ve nasıl bir hareket yapar?', 's. 20-25'],
      ['Güneş, Dünya’dan çok büyük olduğu hâlde neden küçük görünür?', 's. 20-25'],
      ['Ay’ın dönme ve dolanma hareketi nedir? Dünya’dan bakınca neden hep aynı yüzünü görürüz?', 's. 26-34'],
      ['Ay’ın evreleri neden oluşur ve hangi sırayla görülür?', 's. 35-43'],
      ['Güneş, Dünya ve Ay birbirine göre nasıl hareket eder, büyüklükleri nasıl karşılaştırılır?', 's. 44-49']]},
    {unite:'2. Ünite: Kuvveti Tanıyalım', q:[
      ['Kuvvet nedir, nasıl ölçülür ve birimi nedir?', 's. 60-68'],
      ['Dinamometre nasıl çalışır? Yayın kalınlığı neden önemlidir?', 's. 60-68'],
      ['Kütle ile ağırlık arasındaki benzerlik ve farklar nelerdir?', 's. 70-76'],
      ['Bir cismin ağırlığı Ay’da neden Dünya’dakinden farklıdır?', 's. 70-76'],
      ['Sürtünme kuvveti nedir? Günlük hayatta hareketi nasıl kolaylaştırır ya da zorlaştırır?', 's. 78-89']]},
    {unite:'3. Ünite: Canlıların Yapısına Yolculuk', q:[
      ['Bitki ve hayvan hücrelerinin benzer ve farklı yönleri nelerdir?', 's. 100-110'],
      ['Hücre, doku, organ, sistem ve organizma arasındaki ilişki nedir?', 's. 111-115'],
      ['Destek ve hareket sistemini hangi yapılar oluşturur? Kemik, eklem ve kas çeşitleri nelerdir?', 's. 117-128'],
      ['Destek ve hareket sistemimizin sağlığı için neler yapmalıyız?', 's. 129-135']]}
  ],
  'Sosyal Bilgiler': [
    {unite:'1. Alan: Birlikte Yaşamak', q:[
      ['Hangi gruplara dâhilsin ve bu gruplardaki rollerin birbiriyle nasıl ilişkili?', 's. 11-44'],
      ['Farklı kültürel özelliklere saygı duymak birlikte yaşamayı nasıl etkiler?', 's. 11-44'],
      ['Yardımlaşma ve dayanışma toplumsal birliği nasıl sürdürür?', 's. 11-44']]},
    {unite:'2. Alan: Evimiz Dünya', q:[
      ['Yaşadığın ilin konumunu komşu iller, yeryüzü şekilleri ve su kaynaklarına göre anlat.', 's. 50-57'],
      ['Yaşadığın ilde doğal ve beşerî çevre geçmişten bugüne nasıl değişti? Nedenleri ve sonuçları neler?', 's. 58-69'],
      ['Yaşadığın ilde hangi afetler olabilir ve etkilerini azaltmak için neler yapılabilir?', 's. 70-81'],
      ['Ülkemizin kara sınırı olan komşu devletler hangileridir? Başkentleri ve konumları nedir?', 's. 82-92']]},
    {unite:'3. Alan: Ortak Mirasımız', q:[
      ['Somut ve somut olmayan kültürel miras nedir? Ortak miras neden korunmalıdır?', 's. 100-109'],
      ['Anadolu’nun ilk yerleşim yerlerinde (Çayönü, Çatalhöyük, Hacılar) insanlar nasıl yaşıyordu?', 's. 110-127'],
      ['İlk yerleşimlerdeki beslenme, barınma ve geçim ile bugünkü hayat arasındaki benzerlik ve farklar nelerdir?', 's. 110-127'],
      ['Mezopotamya ve Anadolu medeniyetleri ortak mirasa neler katmıştır?', 's. 128-144']]}
  ]
};

const NEW_STEPS = ['Soru', 'Anlat', 'Kelimeler'];

function addNote(draft = {step:1, ders:'', soru:'', ozet:'', keys:null, sinav:''}) {
  if (draft.step === 1) {
    const dersler = [...new Set(['Türkçe','Matematik','Fen Bilimleri','Sosyal Bilgiler','İngilizce', ...notes.map(n => n.ders)])];
    let ders = draft.ders;
    const chips = h('div', {class:'chips'}), ready = h('div');
    const soru = h('input', {type:'text', value:draft.soru, placeholder:'Hazır sorulardan seç ya da kendin yaz'});
    const paint = () => {
      chips.replaceChildren(...dersler.map(d => h('span', {class:'chip' + (d === ders ? ' on' : ''), onclick: () => { ders = d; paint(); }}, d)));
      ready.replaceChildren();
      const plan = CURRICULUM[ders];
      if (!plan) return;
      ready.append(h('label', {}, 'Hazır sorular (5. sınıf, 1. dönem)'),
        h('p', {class:'hint', style:'margin-top:0'}, 'Bir üniteye dokun, sorular açılır. Bir soruya dokununca aşağıdaki kutuya yazılır. Sağdaki yazı, konunun ders kitabında hangi sayfalarda olduğunu gösterir.'));
      plan.forEach(u => ready.append(h('details', {}, h('summary', {style:'color:var(--main-d);font-weight:600'}, u.unite),
        u.q.map(([q, pg]) => h('div', {class:'item', style:'cursor:pointer', onclick: () => { soru.value = q; window.scrollTo(0, document.body.scrollHeight); }}, h('span', {}, q), h('small', {style:'white-space:nowrap;color:var(--soft)'}, 'Kitap ' + pg))))));
    };
    paint();
    const sinav = h('input', {type:'date', value:draft.sinav});
    show(stepper(NEW_STEPS, 0), h('div', {class:'card'},
      h('h2', {}, '1. Hangi ders, hangi soru?'),
      tip('Okumaya başlamadan önce kendine bir soru sor. Okurken cevabı arayacaksın, bu da öğrendiğini aklında tutmana yardım eder.'),
      h('label', {}, 'Ders'), chips, ready,
      h('label', {}, 'Cevaplayacağın soru'),
      h('p', {class:'hint', style:'margin-top:0'}, 'Listeden seçebilir ya da kendin yazabilir, konuşarak da söyleyebilirsin.'),
      soru, micButton(soru),
      h('details', {}, h('summary', {}, 'Sınav günü var mı? (isteğe bağlı)'),
        h('p', {class:'hint'}, 'Sınav tarihini seçersen tekrar günleri sınava göre ayarlanır. Sınavı yoksa boş bırak.'), sinav),
      h('div', {class:'row'}, h('button', {onclick: () => {
        if (!ders || !soru.value.trim()) return alert('Dersi seç ve soruyu yaz.');
        addNote({...draft, step:2, ders, soru:soru.value.trim(), sinav:sinav.value});
      }}, 'Devam'))));
  } else if (draft.step === 2) {
    const ozet = h('textarea', {placeholder:'Kendi cümlelerinle anlat...'}, draft.ozet);
    show(stepper(NEW_STEPS, 1), h('div', {class:'card'},
      h('h2', {}, '2. Oku, kapat, anlat'),
      h('p', {class:'big'}, draft.soru),
      tip('Önce konuyu kitaptan oku. Sonra kitabı kapat ve cevabı bir arkadaşına anlatır gibi söyle ya da yaz. Her şeyi hatırlaman gerekmiyor, aklında kalan yeter. Takıldığın yerde kitaba bakıp eksiğini tamamlayabilirsin.'),
      micButton(ozet), h('div', {style:'height:10px'}), ozet,
      h('div', {class:'row'},
        h('button', {class:'alt', onclick: () => addNote({...draft, step:1, ozet:ozet.value})}, 'Geri'),
        h('button', {onclick: () => {
          if (ozet.value.trim().split(/\s+/).length < 8) return alert('Biraz daha anlat. En az bir iki cümle olsun.');
          addNote({...draft, step:3, ozet:ozet.value.trim(), keys: draft.ozet === ozet.value.trim() ? draft.keys : null});
        }}, 'Devam'))));
  } else {
    const toks = tokens(draft.ozet);
    const keys = new Set(draft.keys || suggestKeys(draft.ozet));
    const counter = h('p', {class:'hint'});
    const upd = () => { counter.textContent = `${keys.size} kelime seçili.`; };
    const box = h('div', {style:'line-height:2.3'});
    toks.forEach((tk, i) => {
      if (!isWord(tk)) return box.append(tk);
      const w = h('span', {class:'word' + (keys.has(i) ? ' on' : ''), onclick: () => { keys.has(i) ? keys.delete(i) : keys.add(i); w.classList.toggle('on'); upd(); }}, tk);
      box.append(w);
    });
    upd();
    show(stepper(NEW_STEPS, 2), h('div', {class:'card'},
      h('h2', {}, '3. Önemli kelimeler'),
      tip('Sarı kelimeleri uygulama önerdi. Tekrar gününde bu kelimeler silinecek, sen yerine koyacaksın. Konunun en önemli kelimelerini seç: terimler, isimler, sayılar. Bir kelimeye dokunarak seçebilir ya da vazgeçebilirsin.'),
      box, counter,
      h('div', {class:'row'},
        h('button', {class:'alt', onclick: () => addNote({...draft, step:2, keys:[...keys]})}, 'Geri'),
        h('button', {onclick: () => {
          if (keys.size < 2) return alert('En az 2 kelime seç.');
          const t = today(), sinav = dateInputToDay(draft.sinav);
          const n = {id: Date.now(), ders:draft.ders, soru:draft.soru, ozet:draft.ozet, keys:[...keys], sinav, step:0, gap:0, created:t};
          n.due = sinav && sinav > t ? t + Math.max(1, Math.ceil((sinav - t) / 10)) : t + 1;
          if (sinav && sinav > t) n.gap = n.due - t;
          notes.push(n); save();
          show(h('div', {class:'card'}, h('h2', {}, 'Kaydedildi'),
            h('p', {class:'big'}, `İlk tekrarın: ${fmt(n.due)}`),
            tip('O güne kadar bu konuya bakma. Biraz unutman işe yarıyor: tekrar günü hatırlamaya çalışmak bilgiyi kalıcı yapar.'),
            h('div', {class:'row'}, h('button', {onclick: home}, 'Ana sayfa'))));
        }}, 'Kaydet'))));
  }
}

/* ---------- Tekrar: önce anlat, sonra boşlukları kelimelerle doldur ---------- */
const REV_STEPS = ['Anlat', 'Boşluklar', 'Sonuç'];

function review(id) {
  const n = notes.find(x => x.id === id);
  const free = h('textarea', {placeholder:'Aklında kalanları anlat...'});
  show(stepper(REV_STEPS, 0), h('div', {class:'card'},
    h('h2', {}, n.ders),
    h('p', {class:'big'}, n.soru),
    tip('Hiçbir yere bakma. Aklında kalanı söyle ya da yaz. Hatırlamakta zorlanman normal. Öğrenmeyi sağlayan da bu zorlanma. Yazdıkların kaydedilmez, sadece hatırlamayı çalıştırır.'),
    micButton(free), h('div', {style:'height:10px'}), free,
    h('div', {class:'row'}, h('button', {onclick: () => blanks(n)}, 'Boşlukları göster'), h('button', {class:'alt', onclick: home}, 'Vazgeç'))));
}

function blanks(n) {
  const toks = tokens(n.ozet), keys = new Set(n.keys);
  const slots = [];  // her boşluk: {ans, filled: kelime ya da null}
  toks.forEach((tk, i) => { if (keys.has(i)) slots.push({ans:tk, filled:null}); });
  const bank = slots.map(s => ({w:s.ans, used:false})).sort(() => Math.random() - .5);
  const boxEl = h('div', {style:'line-height:2.5'}), bankEl = h('div', {class:'chips bank', style:'margin-top:18px'});
  const okBtn = h('button', {disabled:true}, 'Kontrol et');
  const paint = () => {
    boxEl.replaceChildren(); let k = 0;
    toks.forEach((tk, i) => {
      if (!keys.has(i)) return boxEl.append(tk);
      const s = slots[k++];
      boxEl.append(h('span', {class:'blank', onclick: () => { if (!s.filled) return; s.filled = null; bank.forEach(b => { if (b.slot === s) { b.used = false; b.slot = null; } }); paint(); }}, s.filled || '      '));
    });
    bankEl.replaceChildren(...bank.map(b => h('span', {class:'chip' + (b.used ? ' used' : ''), onclick: () => {
      const s = slots.find(x => !x.filled); if (!s) return;
      s.filled = b.w; b.used = true; b.slot = s; paint();
    }}, b.w)));
    okBtn.disabled = slots.some(s => !s.filled);
  };
  okBtn.onclick = () => result(n, toks, keys, slots);
  paint();
  show(stepper(REV_STEPS, 1), h('div', {class:'card'},
    h('h2', {}, 'Boşlukları doldur'),
    tip('Önceki özetinden önemli kelimeler silindi. Aşağıdaki kelimelere dokunarak boşlukları sırayla doldur. Yanlış koyduysan boşluğa dokun, kelime geri gelir. Hepsi dolunca "Kontrol et" açılır.'),
    boxEl, bankEl,
    h('div', {class:'row'}, okBtn)));
}

function result(n, toks, keys, slots) {
  const right = slots.filter(s => tr(s.filled) === tr(s.ans)).length;
  const ratio = right / slots.length;
  const res = ratio >= 0.8 ? 'good' : ratio >= 0.5 ? 'part' : 'bad';
  n.due = nextDue(n, res); save();

  const box = h('div', {style:'line-height:2.2'});
  let k = 0;
  toks.forEach((tk, i) => {
    if (!keys.has(i)) return box.append(tk);
    const s = slots[k++];
    box.append(h('span', {class: tr(s.filled) === tr(s.ans) ? 'good' : 'bad'}, tk));
  });
  const msg = { good:'Çok iyi, yol açılıyor.', part:'Fena değil. Biraz daha pekiştirelim.', bad:'Zorlandın, sorun yok. Zorlanmak öğrenmenin parçası. Yarın yine bakacağız.' }[res];
  const why = { good:'İyi hatırladığın için bir sonraki tekrar daha uzak bir güne kondu.', part:'Bazılarını kaçırdığın için tekrarı biraz yakına aldım.', bad:'Zorlandığın için tekrarı yarına aldım. Tekrar ettikçe kolaylaşacak.' }[res];
  show(stepper(REV_STEPS, 2), h('div', {class:'card'},
    h('h2', {}, `${right} / ${slots.length} doğru`),
    h('p', {class:'big'}, msg),
    h('p', {class:'hint'}, 'Yeşiller bildiklerin, kırmızılar kaçırdıkların. Özetin:'),
    box,
    h('p', {style:'margin-top:16px'}, h('span', {class:'tag'}, `Sıradaki tekrar: ${fmt(n.due)}`)),
    h('p', {class:'hint'}, why),
    h('div', {class:'row'}, h('button', {onclick: home}, 'Ana sayfa'))));
}

home();
</script>
