<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Çalışma Defterim</title>
<style>
  :root { --bg:#f6f3ec; --card:#fff; --ink:#26303b; --soft:#6b7785; --main:#2f6f6a; --main-d:#245a56; --warn:#c2502f; --ok:#2e7d4f; --line:#e2ddd0; --mark:#ffe08a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:20px/1.55 "Segoe UI",system-ui,sans-serif; }
  header { background:var(--main); color:#fff; padding:14px 22px; display:flex; align-items:center; justify-content:space-between; }
  header h1 { font-size:24px; margin:0; font-weight:600; }
  header button { background:transparent; color:#fff; border:1px solid #ffffff88; }
  main { max-width:820px; margin:0 auto; padding:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; margin-bottom:16px; }
  h2 { font-size:22px; margin:0 0 10px; }
  p.hint { color:var(--soft); font-size:17px; margin:4px 0 12px; }
  button { font:inherit; font-weight:600; padding:12px 20px; border-radius:12px; border:0; background:var(--main); color:#fff; cursor:pointer; min-height:48px; }
  button.alt { background:#e8efee; color:var(--main-d); }
  button.danger { background:#f7e3dc; color:var(--warn); }
  button:disabled { opacity:.45; }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  input[type=text], input[type=date], select, textarea { font:inherit; width:100%; padding:12px; border:2px solid var(--line); border-radius:12px; background:#fff; color:var(--ink); }
  textarea { min-height:170px; resize:vertical; }
  label { display:block; font-weight:600; margin:14px 0 6px; }
  .word { display:inline-block; padding:2px 5px; margin:2px 1px; border-radius:8px; cursor:pointer; }
  .word.on { background:var(--mark); font-weight:700; }
  .item { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
  .item:last-child { border-bottom:0; }
  .item small { color:var(--soft); display:block; font-size:16px; }
  .blank { display:inline-block; width:auto; min-width:90px; padding:4px 8px; margin:2px; border-width:2px; font-size:19px; text-align:center; }
  .good { color:var(--ok); font-weight:700; background:#e3f3e8; border-radius:6px; padding:0 4px; }
  .bad { color:var(--warn); font-weight:700; background:#fbe6df; border-radius:6px; padding:0 4px; }
  .big { font-size:26px; font-weight:700; }
  .tag { display:inline-block; background:#e8efee; color:var(--main-d); border-radius:999px; padding:2px 12px; font-size:15px; font-weight:600; }
  .empty { color:var(--soft); text-align:center; padding:18px 0; }
</style>
</head>
<body>
<header><h1>Çalışma Defterim</h1><button id="homeBtn">Ana sayfa</button></header>
<main id="app"></main>

<script>
/* ---------- Veri ---------- */
const KEY = 'calisma-defteri-v1';
let notes = JSON.parse(localStorage.getItem(KEY) || '[]');
const save = () => localStorage.setItem(KEY, JSON.stringify(notes));

const today = () => { const d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset()*60000) / 864e5); };
const dayToDate = n => new Date(n*864e5 + new Date().getTimezoneOffset()*60000);
const fmt = n => dayToDate(n).toLocaleDateString('tr-TR', {day:'numeric', month:'long'});
const dateInputToDay = v => { if(!v) return null; const [y,m,d] = v.split('-').map(Number); return Math.floor(Date.UTC(y,m-1,d)/864e5); };
const tr = s => s.toLocaleLowerCase('tr');
const tokens = text => text.match(/[\p{L}\p{N}]+|[^\p{L}\p{N}]+/gu) || [];
const isWord = t => /[\p{L}\p{N}]/u.test(t);

/* Tekrar aralığı: sınav varsa ilk aralık = kalan günün onda biri, sonra ikiye katlanır;
   sınav yoksa 1-3-7-14-30-60 gün. */
const LADDER = [1,3,7,14,30,60];
function nextDue(n, result) {
  const t = today();
  if (result === 'bad') { n.step = 0; n.gap = 1; return t + 1; }
  if (result === 'part') { return t + 2; }
  n.step = (n.step || 0) + 1;
  if (n.sinav && n.sinav > t) {
    const remaining = n.sinav - t;
    const gap = n.gap ? n.gap * 2 : Math.max(1, Math.ceil(remaining / 10));
    n.gap = gap;
    return Math.min(t + gap, Math.max(t + 1, n.sinav - 1));
  }
  return t + LADDER[Math.min(n.step, LADDER.length - 1)];
}

/* ---------- Yardımcılar ---------- */
function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) e.append(kid instanceof Node ? kid : document.createTextNode(kid));
  return e;
}
const app = document.getElementById('app');
const show = (...els) => { app.replaceChildren(...els); window.scrollTo(0, 0); };
document.getElementById('homeBtn').onclick = () => home();

function lev(a, b) {
  const d = Array.from({length: a.length+1}, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}
const matches = (given, answer) => {
  const g = tr(given.trim()), a = tr(answer);
  return g === a || (a.length >= 5 && g.length > 0 && lev(g, a) <= 1);
};

/* ---------- Ana sayfa ---------- */
function home() {
  const t = today();
  const due = notes.filter(n => n.due <= t).sort((a,b) => a.due - b.due);
  const rest = notes.filter(n => n.due > t).sort((a,b) => a.due - b.due);

  const dueCard = h('div', {class:'card'}, h('h2', {}, 'Bugün tekrar edilecekler'));
  if (!due.length) dueCard.append(h('div', {class:'empty'}, notes.length ? 'Bugünlük tekrar yok. Güzel!' : 'Henüz not yok. İlk notunu ekleyerek başla.'));
  due.forEach(n => dueCard.append(h('div', {class:'item'},
    h('div', {}, h('strong', {}, n.soru), h('small', {}, n.ders)),
    h('button', {onclick: () => review(n.id)}, 'Tekrar et'))));

  const restCard = h('div', {class:'card'}, h('h2', {}, 'Tüm notlarım'));
  if (!rest.length) restCard.append(h('div', {class:'empty'}, 'Başka not yok.'));
  rest.forEach(n => restCard.append(h('div', {class:'item'},
    h('div', {}, h('strong', {}, n.soru), h('small', {}, `${n.ders} · sıradaki tekrar: ${fmt(n.due)}`)),
    h('button', {class:'danger', onclick: () => { if (confirm('Bu not silinsin mi?')) { notes = notes.filter(x => x.id !== n.id); save(); home(); } }}, 'Sil'))));

  const tools = h('div', {class:'row'},
    h('button', {class:'alt', onclick: backup}, 'Yedek al'),
    h('button', {class:'alt', onclick: () => fileIn.click()}, 'Yedek yükle'));
  const fileIn = h('input', {type:'file', accept:'.json', style:'display:none', onchange: restore});

  show(h('div', {class:'row', style:'margin:0 0 16px'}, h('button', {class:'big', onclick: () => addNote()}, '+ Yeni not ekle')),
       dueCard, restCard, tools, fileIn);
}

function backup() {
  const a = h('a', {href: URL.createObjectURL(new Blob([JSON.stringify(notes)], {type:'application/json'})), download:`calisma-defteri-yedek-${today()}.json`});
  a.click();
}
function restore(e) {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(txt => {
    try {
      const data = JSON.parse(txt);
      if (!Array.isArray(data)) throw 0;
      if (confirm(`Yedekteki ${data.length} not yüklenecek. Şimdiki notların yerine geçer. Devam?`)) { notes = data; save(); home(); }
    } catch { alert('Bu dosya geçerli bir yedek değil.'); }
  });
}

/* ---------- Yeni not: 3 adım ---------- */
function addNote(draft = {step:1, ders:'', soru:'', ozet:'', keys:[], sinav:''}) {
  if (draft.step === 1) {
    const dersler = [...new Set(notes.map(n => n.ders))];
    const list = h('datalist', {id:'dersler'}, dersler.map(d => h('option', {value:d})));
    const ders = h('input', {type:'text', list:'dersler', value:draft.ders, placeholder:'Örn. Fen Bilimleri'});
    const soru = h('input', {type:'text', value:draft.soru, placeholder:'Örn. Mevsimler neden oluşur?'});
    const sinav = h('input', {type:'date', value:draft.sinav});
    show(h('div', {class:'card'},
      h('h2', {}, '1. Önce bir soru sor'),
      h('p', {class:'hint'}, 'Konu başlığını soruya çevir. Okurken cevabını arayacaksın; bu, aklında kalmasına yardım eder.'),
      h('label', {}, 'Ders'), ders, list,
      h('label', {}, 'Sorun'), soru,
      h('label', {}, 'Sınav günü (biliyorsan)'), sinav,
      h('p', {class:'hint'}, 'Sınav günü girersen tekrarlar ona göre ayarlanır.'),
      h('div', {class:'row'}, h('button', {onclick: () => {
        if (!ders.value.trim() || !soru.value.trim()) return alert('Ders ve soru boş olmasın.');
        addNote({...draft, step:2, ders:ders.value.trim(), soru:soru.value.trim(), sinav:sinav.value});
      }}, 'Devam: okumaya geç'))));
  } else if (draft.step === 2) {
    const ozet = h('textarea', {placeholder:'Kendi cümlelerinle yaz...'}, draft.ozet);
    show(h('div', {class:'card'},
      h('h2', {}, '2. Oku, kapat, anlat'),
      h('p', {class:'big'}, draft.soru),
      h('p', {class:'hint'}, 'Konuyu oku. Sonra kitabı veya defteri KAPAT ve bu soruya cevabı bir arkadaşına anlatır gibi kendi cümlelerinle yaz. Takıldığın yeri sonra kitaptan bakıp tamamlayabilirsin.'),
      ozet,
      h('div', {class:'row'},
        h('button', {class:'alt', onclick: () => addNote({...draft, step:1, ozet:ozet.value})}, 'Geri'),
        h('button', {onclick: () => {
          if (ozet.value.trim().split(/\s+/).length < 8) return alert('Biraz daha yaz. En az bir iki cümle olsun.');
          addNote({...draft, step:3, ozet:ozet.value.trim()});
        }}, 'Devam: önemli kelimeler'))));
  } else {
    const toks = tokens(draft.ozet);
    const keys = new Set(draft.keys);
    const counter = h('p', {class:'hint'});
    const upd = () => { counter.textContent = `${keys.size} kelime seçili. İdeal: 4 ile 10 arası.`; };
    const box = h('div', {style:'line-height:2.2'});
    toks.forEach((tk, i) => {
      if (!isWord(tk)) return box.append(tk);
      const w = h('span', {class:'word' + (keys.has(i) ? ' on' : ''), onclick: () => { keys.has(i) ? keys.delete(i) : keys.add(i); w.classList.toggle('on'); upd(); }}, tk);
      box.append(w);
    });
    upd();
    show(h('div', {class:'card'},
      h('h2', {}, '3. Önemli kelimeleri seç'),
      h('p', {class:'hint'}, 'Tekrar günü bu kelimeler boşluk olacak. Konuyu en iyi anlatan kelimelere dokun: terimler, isimler, sayılar.'),
      box, counter,
      h('div', {class:'row'},
        h('button', {class:'alt', onclick: () => addNote({...draft, step:2, keys:[...keys]})}, 'Geri'),
        h('button', {onclick: () => {
          if (keys.size < 2) return alert('En az 2 kelime seç.');
          const t = today(), sinav = dateInputToDay(draft.sinav);
          const n = {id: Date.now(), ders:draft.ders, soru:draft.soru, ozet:draft.ozet, keys:[...keys], sinav, step:0, gap:0, created:t};
          n.due = sinav && sinav > t ? t + Math.max(1, Math.ceil((sinav - t) / 10)) : t + 1;
          if (sinav && sinav > t) n.gap = n.due - t;
          notes.push(n); save();
          show(h('div', {class:'card'}, h('h2', {}, 'Kaydedildi'),
            h('p', {}, `İlk tekrarın: ${fmt(n.due)}. O güne kadar bu konuya bakma. Biraz unutman işe yarıyor.`),
            h('div', {class:'row'}, h('button', {onclick: home}, 'Ana sayfa'))));
        }}, 'Kaydet'))));
  }
}

/* ---------- Tekrar ---------- */
function review(id) {
  const n = notes.find(x => x.id === id);
  const free = h('textarea', {placeholder:'Aklında kalanları yaz...'});
  show(h('div', {class:'card'},
    h('h2', {}, n.ders),
    h('p', {class:'big'}, n.soru),
    h('p', {class:'hint'}, 'Hiçbir yere bakma. Bu soruya aklında kalanı kendi cümlelerinle yaz. Zorlanman normal, öğrenmeyi sağlayan da bu zorlanma.'),
    free,
    h('div', {class:'row'}, h('button', {onclick: () => blanks(n)}, 'Boşlukları göster'), h('button', {class:'alt', onclick: home}, 'Vazgeç'))));
}

function blanks(n) {
  const toks = tokens(n.ozet), keys = new Set(n.keys), inputs = [];
  const box = h('div', {style:'line-height:2.4'});
  toks.forEach((tk, i) => {
    if (!keys.has(i)) return box.append(tk);
    const inp = h('input', {type:'text', class:'blank', autocapitalize:'off', autocomplete:'off', style:`width:${Math.max(90, tk.length*14)}px`});
    inputs.push({inp, ans:tk}); box.append(inp);
  });
  show(h('div', {class:'card'},
    h('h2', {}, 'Boşlukları doldur'),
    h('p', {class:'hint'}, 'Kendi özetinden kelimeler silindi. Hatırladığını yaz, bilmediğini boş bırak.'),
    box,
    h('div', {class:'row'}, h('button', {onclick: () => result(n, toks, keys, inputs)}, 'Kontrol et'))));
}

function result(n, toks, keys, inputs) {
  const right = inputs.filter(({inp, ans}) => matches(inp.value, ans)).length;
  const ratio = right / inputs.length;
  const res = ratio >= 0.8 ? 'good' : ratio >= 0.5 ? 'part' : 'bad';
  n.due = nextDue(n, res); save();

  const box = h('div', {style:'line-height:2.2'});
  let k = 0;
  toks.forEach((tk, i) => {
    if (!keys.has(i)) return box.append(tk);
    const ok = matches(inputs[k].inp.value, tk);
    box.append(h('span', {class: ok ? 'good' : 'bad'}, tk));
    k++;
  });
  const msg = { good:'Çok iyi, yol açılıyor.', part:'Fena değil. Biraz daha pekiştirelim.', bad:'Zorlandın, sorun yok. Zorlanmak öğrenmenin parçası. Yarın yine bakacağız.' }[res];
  show(h('div', {class:'card'},
    h('h2', {}, `${right} / ${inputs.length} doğru`),
    h('p', {class:'big'}, msg),
    h('p', {class:'hint'}, 'Yeşiller bildiklerin, kırmızılar kaçırdıkların. Özetinin tamamı:'),
    box,
    h('p', {}, h('span', {class:'tag'}, `Sıradaki tekrar: ${fmt(n.due)}`)),
    h('div', {class:'row'}, h('button', {onclick: home}, 'Ana sayfa'))));
}

home();
</script>
</body>
</html>
